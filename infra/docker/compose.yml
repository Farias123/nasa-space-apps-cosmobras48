version: '3.9'

services:
  database:
    image: mongo
    container_name: nasa-sac-database-ctnr
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    ports:
      - "27017:27017"
    healthcheck:
      test:  echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - mongodb-data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    env_file:
      - ./database/.database.env
    restart: unless-stopped
    networks:
      - default-net
  
  mongo-express:
    image: mongo-express
    container_name: nasa-sac-mongo-express-ctnr
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ./database/.mongo-express.env    
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default-net

  frontend:
    image: cosmobras48/nasa-sac-frontend:latest
    container_name: nasa-sac-frontend-ctnr
    build:
      context: ../..
      dockerfile: ./infra/docker/frontend/Dockerfile
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    command: ["run", "start" ]
    ports:
      - "3000:3000"
    volumes:
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
      - ../../frontend/src:/home/cosmobras48/frontend/src
      - ../../frontend/public:/home/cosmobras48/frontend/public
    env_file:
      - ./frontend/.frontend.env
    restart: unless-stopped
    networks:
      - default-net

  backend:
    image: cosmobras/nasa-sac-backend:latest
    container_name: nasa-sac-backend-ctnr
    build:
      context: ../..
      dockerfile: ./infra/docker/backend/Dockerfile
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    command: [ "python", "-m", "src.main" ]
    ports:
      - "8001:8001"
    volumes:
      - '/etc/timezone:/etc/timezone:ro'
      - '/etc/localtime:/etc/localtime:ro'
      - ../../backend/src:/home/cosmobras48/backend/src
    env_file:
      - ./backend/.backend.env
    restart: unless-stopped
    networks:
      - default-net

networks:
  default-net:
    driver: bridge

volumes:
  mongodb-data:
